<!doctype html><html><head><meta charset="utf-8"><title>probe</title>
<style>body{margin:0;background:#111;color:#0f0;font:13px ui-monospace,monospace;padding:10px;white-space:pre-wrap}</style>
</head><body><pre id="out">consultando…</pre>
<script type="module">
const url = import.meta.env.VITE_APPS_SCRIPT_URL;
const out = document.getElementById('out');
const lines = []; const say = (t) => { lines.push(t); out.textContent = lines.join('\n'); };
const post = async (p) => JSON.parse(await (await fetch(url, { method: 'POST', redirect: 'follow', body: JSON.stringify(p) })).text());
const r = await post({ action: 'listUsers', adminDni: '76018787', adminPassword: 'kirito' });
say('listUsers status: ' + r.status + (r.message ? ' — ' + r.message : ''));
(r.users || []).forEach(u => {
  say('  ' + u.DNI + ' | Estado=' + JSON.stringify(u.Estado) + ' | Tipo=' + JSON.stringify(u.TipoUsuario) + ' | Pass=' + JSON.stringify(u.Pass));
});
if (r.users && r.users[0]) say('claves devueltas: ' + JSON.stringify(Object.keys(r.users[0])));
</script>
</body></html>
